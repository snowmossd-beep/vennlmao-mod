name: Unzip guns patches

on:
  workflow_dispatch:
  push:
    paths:
      - "guns-patch-part*.zip"

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip part01 -> part14
        run: |
          set -e
          for i in $(seq -w 1 14); do
            f="guns-patch-part${i}.zip"
            if [ ! -f "$f" ]; then
              echo "::error::Thiếu file $f"
              exit 1
            fi
            echo "==> Giải nén $f"
            unzip -oq "$f" -d .
          done
          echo "Tổng file patch: $(find guns/patch -type f | wc -l)"

      - name: Commit kết quả
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add guns/patch
          git diff --cached --quiet || git commit -m "Unzip guns patches"
          git push
